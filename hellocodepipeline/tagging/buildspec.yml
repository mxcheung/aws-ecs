  pre_build:
    commands:
      - echo "Generating date tag..."
      - DATE_TAG=$(date +%y%m%d)
      - echo "DATE_TAG=$DATE_TAG"

      - echo "Fetching existing image tags from ECR..."
      - |
        EXISTING_TAGS=$(aws ecr list-images \
          --repository-name "$REPO_NAME" \
          --region "$REGION" \
          --query 'imageIds[*].imageTag | [?@ != `null`] | []' \
          --output text | tr '\t' '\n')

      - echo "Computing next version suffix..."
      - |
        MAX_SUFFIX=$(echo "$EXISTING_TAGS" | awk -F- -v prefix="$DATE_TAG" '
          {
            if (NF == 2 && $1 == prefix && $2 ~ /^[0-9]+$/) {
              if ($2+0 > max) max = $2+0
            }
          }
          END { printf("%03d", max+1) }')

      - IMAGE_TAG="$DATE_TAG-$MAX_SUFFIX"
      - echo "Generated image tag: $IMAGE_TAG"
