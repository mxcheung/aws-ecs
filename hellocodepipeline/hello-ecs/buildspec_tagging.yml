version: 0.2

phases:
  install:
    runtime-versions:
      docker: 18
  pre_build:
    commands:
      - echo "🔐 Logging in to ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION \
          | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - export REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME
      - export BRANCH=$(echo $CODEBUILD_SOURCE_VERSION | sed -E 's#/refs/heads/##' | tr '[:lower:]' '[:upper:]')
      - export DATE=$(date +%y%m%d)

      - |
        echo "🔍 Fetching today's $BRANCH tags"
        TAGS=$(aws ecr describe-images \
          --repository-name $ECR_REPOSITORY_NAME \
          --filter tagStatus=TAGGED \
          --query "imageDetails[?starts_with(imageTags[0], \`${BRANCH}-${DATE}-\`)].imageTags[]" \
          --output text)
        LAST=$(echo "$TAGS" | sed -E "s/^$BRANCH-$DATE-([0-9]{3})$/\1/" | sort -n | tail -n1)
        NEXT=$(printf "%03d" $((10#$LAST + 1)))
        export IMAGE_TAG="$BRANCH-$DATE-$NEXT"
        echo "➡️ Using tag: $IMAGE_TAG"
  build:
    commands:
      - echo "🛠 Building image"
      - docker build -t $REPO_URI:latest .
      - docker tag $REPO_URI:latest $REPO_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo "📦 Pushing $IMAGE_TAG and latest"
      - docker push $REPO_URI:latest
      - docker push $REPO_URI:$IMAGE_TAG
      - echo "{\"imageUri\":\"$REPO_URI:$IMAGE_TAG\"}" > image-info.json
artifacts:
  files:
    - image-info.json
