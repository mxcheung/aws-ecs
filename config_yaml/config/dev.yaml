env:
  account: "123456789012"
  region: "ap-southeast-2"

pipeline:
  name: "MyAppPipeline"

source:
  codeCommit:
    repositoryName: "my-cdk-app"
    branch: "main"

ecr:
  repositoryUri: "123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/my-app"
  tag: "latest"
  dockerContext: "."         # relative path to Dockerfile

vpc:
  maxAzs: 2

ecs:
  clusterName: "my-cluster"
  serviceName: "my-service"
  instanceType: "t3.micro"
  memory: 256                # container memory (MiB)
